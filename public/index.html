<!doctype html>
<html lang="ko">

  <link rel="stylesheet" href="/css/style.css">

</head>
<body>

  <main class="main">

      <label>

      <label>
        유형
        <select name="type" id="type"><option value="">전체</option></select>
      </label>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <ul class="list" id="list"></ul>
  </main>

</html>
