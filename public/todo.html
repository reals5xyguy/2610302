<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #2563eb;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --card: #292524;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --border: #44403c;
        --accent: #60a5fa;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    button {
      cursor: pointer;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
    }
    .add {
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
    }
    ul { list-style: none; padding: 0; margin: 20px 0 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .del {
      background: none;
      color: var(--muted);
      font-size: 1.2rem;
      padding: 0 4px;
    }
    .del:hover { color: var(--danger); }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .clear { background: none; color: var(--muted); font-size: 0.9rem; }
    .clear:hover { color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <main>
    <h1>할 일 목록</h1>
    <form id="form">
      <input id="input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" required>
      <button class="add" type="submit">추가</button>
    </form>
    <ul id="list"></ul>
    <footer>
      <span id="count"></span>
      <button class="clear" id="clear" type="button">완료 항목 삭제</button>
    </footer>
  </main>

  <script>
    const KEY = "todos";
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    let todos = load();

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {}
    }

    function render() {
      list.innerHTML = "";
      if (todos.length === 0) {
        list.innerHTML = '<li class="empty">할 일이 없습니다</li>';
      }
      todos.forEach((todo) => {
        const li = document.createElement("li");
        if (todo.done) li.className = "done";

        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = todo.done;
        check.addEventListener("change", () => {
          todo.done = check.checked;
          update();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "×";
        del.title = "삭제";
        del.addEventListener("click", () => {
          todos = todos.filter((t) => t.id !== todo.id);
          update();
        });

        li.append(check, text, del);
        list.appendChild(li);
      });

      const left = todos.filter((t) => !t.done).length;
      count.textContent = `남은 할 일 ${left}개 / 전체 ${todos.length}개`;
    }

    function update() {
      save();
      render();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = "";
      update();
    });

    document.getElementById("clear").addEventListener("click", () => {
      todos = todos.filter((t) => !t.done);
      update();
    });

    render();
  </script>
</body>
</html>
